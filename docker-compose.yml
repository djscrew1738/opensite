version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: opensite-backend
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=llama3.1
      - DATABASE_URL=postgres://postgres:postgres@db:5432/opensite
    depends_on:
      - db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: opensite-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:5001
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: opensite-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=opensite
    volumes:
      - ./data/storage/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d opensite"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [default]

  redis-plumber:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 256M
    volumes:
      - ./data/storage/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
    networks: [default]

  chromadb-plumber:
    image: chromadb/chroma:latest
    deploy:
      resources:
        limits:
          memory: 2G
    volumes:
      - ./data/storage/chromadb:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
    networks: [default]

  # Worker service - disabled by default
  # To enable: uncomment and ensure workers/tasks.py exists with arq worker setup
  # worker-plumber:
  #   build:
  #     context: .
  #     dockerfile: backend/Dockerfile
  #   working_dir: /app
  #   command: python3 -m workers.tasks
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 6G
  #   volumes:
  #     - ./data/uploads:/app/data/uploads
  #     - ./workers:/app/workers
  #   depends_on:
  #     - redis-plumber
  #     - chromadb-plumber
  #   environment:
  #     - REDIS_URL=redis://redis-plumber:6379
  #     - OLLAMA_HOST=http://host.docker.internal:11434
  #   healthcheck:
  #     test:
  #       - "CMD"
  #       - "python3"
  #       - "-c"
  #       - "import arq; from arq.connections import ArqRedis; ArqRedis.from_url('redis://redis-plumber:6379').ping()"
  #     interval: 30s
  #   networks: [default]

networks:
  default:
    name: opensite-network
