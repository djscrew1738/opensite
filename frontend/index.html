<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0B0D" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Dark Forge fonts: Inter (UI) + JetBrains Mono (data) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- DNS prefetch for API -->
    <link rel="dns-prefetch" href="//localhost" />

    <!-- OpenSeadragon deep-zoom viewer -->
    <script src="https://cdn.jsdelivr.net/npm/openseadragon@5.0.1/build/openseadragon/openseadragon.min.js"></script>

    <title>Job Pulse — CTL Plumbing</title>

    <!-- Theme detection — prevent flash -->
    <script>
      (function() {
        const theme = localStorage.getItem('theme') ||
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <style>
      /* Critical CSS for instant render */
      #root {
        min-height: 100vh;
        min-height: 100dvh;
      }

      .initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: #f8fafc;
        z-index: 9999;
      }

      .dark .initial-loader {
        background: #0A0B0D;
      }

      /* Electric blue spinner */
      .loader-ring {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 3px solid rgba(59, 130, 246, 0.12);
        border-top-color: #3B82F6;
        animation: spin 0.8s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      }

      .loader-text {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: rgba(148, 163, 184, 0.5);
      }

      .dark .loader-text {
        color: rgba(71, 85, 105, 0.6);
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="initial-loader">
        <div class="loader-ring"></div>
        <div class="loader-text">Job Pulse</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
